name: Bench

# By hand only (`gh workflow run bench.yml`): the browser figures of `bench/` on a
# GitHub Linux runner, for the Linux side of #421. A shared runner is a noisy
# machine: its figures are not comparable with the baselines made on a Mac, only
# with another run of this job, and the result is an artifact, not a verdict.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Rows"
        default: "100000"
      throttle:
        description: "Chrome's slowdown of the page's main thread, not a Worker (1 = none)"
        default: "1"
      cpu:
        description: "CPU quota for the whole tool, Worker included, in percent of one core (empty = none)"
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      # bench/ has its own lockfile and its own Playwright
      - run: pnpm --dir bench install --frozen-lockfile
      - run: pnpm --dir bench exec playwright install --with-deps chromium
      - run: just bench-local-build
      # Chrome's throttle does not reach a Worker, so a slower machine for opengrid (whose engine
      # runs in one) is a cgroup quota around the whole tool: the kernel limits every thread of
      # node, the browser and the Worker together. A short period (10 ms) keeps the quota from
      # showing as 100 ms stalls in the frame figures.
      - name: Bench
        env:
          ROWS: ${{ inputs.rows }}
          THROTTLE: ${{ inputs.throttle }}
          CPU: ${{ inputs.cpu }}
        run: |
          bench=(env "PATH=$PATH" "HOME=$HOME" BENCH_LOCAL=1 pnpm --dir bench bench:self --rows "$ROWS" --runs 5 --throttle "$THROTTLE")
          if [ -n "$CPU" ]; then
            sudo systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" \
              -p CPUQuota="${CPU}%" -p CPUQuotaPeriodSec=10ms -- "${bench[@]}"
          else
            "${bench[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-linux-${{ inputs.rows }}-x${{ inputs.throttle }}-cpu${{ inputs.cpu || 'all' }}
          path: bench/results/*.json
          if-no-files-found: error
