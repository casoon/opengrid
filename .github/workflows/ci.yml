name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Same wasm-opt the justfile is written against (E4).
  BINARYEN_VERSION: "132"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just check
      - run: just wasm-check
      # E25 keeps `grid` and `pivot` as a way out for a consumer who wants only
      # one element. A feature nobody builds is a feature that stops building,
      # so both single-element modules are compiled here.
      - run: cargo check -p opengrid-web-components --target wasm32-unknown-unknown --no-default-features --features grid
      - run: cargo check -p opengrid-web-components --target wasm32-unknown-unknown --no-default-features --features pivot

  postgres:
    runs-on: ubuntu-latest
    # The conformance suite against a real database (plan point 26, risk R4).
    # A service container, not `testcontainers`: the runner provides PostgreSQL,
    # the tests only need a connection string, and the same tests run locally
    # against whatever server the developer already has.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      OPENGRID_TEST_PG: "host=localhost user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p opengrid-datasource-postgres

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # wasm-bindgen CLI and wasm-opt are what `just wasm-build-components` needs
      # (plan/spezifikation/14-entscheidungen.md E4); both are pinned to the
      # versions the local toolchain uses so the module matches.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      # binaryen pinned to the version the justfile's `wasm-opt -Oz` expects
      # (E4: the WASM toolchain is pinned, not "whatever is installed"). The
      # apt package was what stood here, and it is old enough that it cannot
      # parse what a current rustc emits — "invalid code after misc prefix",
      # which is a WASM feature the tool predates, not a broken module.
      - name: Install binaryen ${{ env.BINARYEN_VERSION }}
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          # The Angular example's CLI asks for 22.22.3 or later (plan point
          # 81); a pinned minor is that, reproducibly, whatever the runner has.
          node-version: "22.23"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just e2e

  publish-dry-run:
    runs-on: ubuntu-latest
    # The release path, walked without releasing (plan point 40, step 6). It
    # packs `@casoon/opengrid` exactly as `just package` does and asks npm what
    # it would send. A dry run needs no token, so this runs on every push and
    # the tarball can never drift from the checklist in docs/releasing.md.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      # binaryen pinned to the version the justfile's `wasm-opt -Oz` expects
      # (E4: the WASM toolchain is pinned, not "whatever is installed"). The
      # apt package was what stood here, and it is old enough that it cannot
      # parse what a current rustc emits — "invalid code after misc prefix",
      # which is a WASM feature the tool predates, not a broken module.
      - name: Install binaryen ${{ env.BINARYEN_VERSION }}
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      # pnpm packs the adapters: it writes the element package's version
      # where the workspace has `workspace:^` (plan point 77).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: just package
      - name: npm publish --dry-run
        run: npm publish --dry-run
        working-directory: target/npm-package/package
      - name: npm publish --dry-run (React adapter)
        run: npm publish --dry-run
        working-directory: target/npm-package-react/package
      - name: npm publish --dry-run (Vue adapter)
        run: npm publish --dry-run
        working-directory: target/npm-package-vue/package
      - name: npm publish --dry-run (Svelte adapter)
        run: npm publish --dry-run
        working-directory: target/npm-package-svelte/package

  baselines:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # Regenerates the **Linux** screenshot baselines and uploads them.
    #
    # They cannot be made on a developer's Mac: the same Chromium renders the
    # same page with different fonts, which is why the baselines are keyed by
    # platform at all (see tests/e2e/playwright.config.js). Run this by hand
    # after a visible control changes, download the artifact, and commit the
    # files — reading the diff first, because a baseline accepted without
    # looking is a test that has stopped testing.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - name: Install binaryen ${{ env.BINARYEN_VERSION }}
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xz
          echo "$PWD/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          # The Angular example's CLI asks for 22.22.3 or later (plan point
          # 81); a pinned minor is that, reproducibly, whatever the runner has.
          node-version: "22.23"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just wasm-build-components
      - run: just wasm-build
      - run: cargo build -p opengrid-server
      - run: just package
      # The framework examples the React, Vue and Svelte specs run against.
      - run: pnpm --filter "./examples/*" build
      - name: Regenerate the Linux baselines
        run: pnpm exec playwright test --config tests/e2e/playwright.config.js --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: tests/e2e/__screenshots__/*-linux.png
          if-no-files-found: error
