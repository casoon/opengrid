name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just check
      - run: just wasm-check

  postgres:
    runs-on: ubuntu-latest
    # The conformance suite against a real database (plan point 26, risk R4).
    # A service container, not `testcontainers`: the runner provides PostgreSQL,
    # the tests only need a connection string, and the same tests run locally
    # against whatever server the developer already has.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      OPENGRID_TEST_PG: "host=localhost user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p opengrid-datasource-postgres

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # wasm-bindgen CLI and wasm-opt are what `just wasm-build-components` needs
      # (plan/spezifikation/14-entscheidungen.md E4); both are pinned to the
      # versions the local toolchain uses so the module matches.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just e2e
