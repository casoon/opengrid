name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browsers:
        description: "Also run the e2e suite in Firefox and WebKit (just e2e-browsers)"
        type: boolean
        default: false

# One run per ref: a new push to a PR cancels the superseded run. Not on main,
# where every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check
      - run: just wasm-check
      # Advisories, licences, bans and sources (deny.toml). The advisory
      # database is fetched fresh, so a new advisory can fail an unrelated PR;
      # that is the point of the check.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The crates that go to crates.io (#241), packed and built from their
      # packages in dependency order, so a broken package never first shows
      # in the release. Nothing is uploaded; `publish = false` crates are skipped.
      - run: cargo publish --workspace --dry-run --locked
      # E25 keeps `grid` and `pivot` as a way out for a consumer who wants only
      # one element. A feature nobody builds is a feature that stops building,
      # so both single-element modules are compiled here.
      - run: cargo check -p opengrid-web-components --target wasm32-unknown-unknown --no-default-features --features grid
      - run: cargo check -p opengrid-web-components --target wasm32-unknown-unknown --no-default-features --features pivot

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The conformance suite against a real database (plan point 26, risk R4).
    # A service container, not `testcontainers`: the runner provides PostgreSQL,
    # the tests only need a connection string, and the same tests run locally
    # against whatever server the developer already has.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      OPENGRID_TEST_PG: "host=localhost user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A second server that speaks TLS, for tests/tls_postgres.rs (issue #220):
      # a private authority and a server certificate for `localhost`, valid for
      # two days. The service container above stays without TLS, which is what
      # the "no fallback to clear text" test needs.
      - name: PostgreSQL with TLS
        run: |
          mkdir -p "$RUNNER_TEMP/pgtls" && cd "$RUNNER_TEMP/pgtls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj "/CN=opengrid test CA"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile ext.cnf
          sudo chown 999:999 server.key && sudo chmod 600 server.key
          docker run -d --name pgtls -p 55432:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$PWD":/certs:ro postgres:16 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 30); do
            PGPASSWORD=postgres psql "host=localhost port=55432 user=postgres dbname=postgres sslmode=require" -c 'select 1' && break
            sleep 2
          done
          echo "OPENGRID_TEST_PG_TLS=host=localhost port=55432 user=postgres password=postgres dbname=postgres" >> "$GITHUB_ENV"
          echo "OPENGRID_TEST_PG_TLS_ROOT=$PWD/ca.pem" >> "$GITHUB_ENV"
      - run: cargo test -p opengrid-datasource-postgres --features tls
      # The export endpoint against the same database (issue #2): the tenant
      # filter in SQL, the count before the first byte, a client that leaves.
      - run: cargo test -p opengrid-server --test export_postgres

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Toolchains, the pinned wasm tools and node: one composite action for
      # the four jobs that build the modules, where every version is pinned.
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The conformance cases and the element's own tests in a real browser
      # (`just wasm-test`): the runner's Chrome and its chromedriver, which match.
      # Without this step the WASM path of the cases ran only when someone
      # remembered the recipe (#358).
      - run: just wasm-test
      - run: just e2e

  e2e-browsers:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.browsers
    timeout-minutes: 60
    # The two engines beyond Chromium (docs/releasing.md), by hand: `gh workflow
    # run ci.yml -f browsers=true`. On Linux, so a release does not depend on
    # the Firefox build Playwright ships for the release machine's macOS — the
    # one for 0.11.0 did not start there. Not on PRs: `just e2e` and its
    # Chromium are the per-change check, this is the per-release one.
    steps:
      - uses: actions/checkout@v7
      # Toolchains, the pinned wasm tools and node: one composite action for
      # the four jobs that build the modules, where every version is pinned.
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: just e2e-browsers

  publish-dry-run:
    runs-on: ubuntu-latest
    # About a minute with a warm cache; a cold Rust build takes several, and
    # the MCP view's nightly build of std (below) some more.
    timeout-minutes: 45
    # The release path, walked without releasing (plan point 40, step 6). It
    # packs `@casoon/opengrid` exactly as `just package` does and asks npm what
    # it would send. A dry run needs no token, so this runs on every push and
    # the tarball can never drift from the checklist in docs/releasing.md.
    # The tarball is kept as the `npm-packages` artifact: it was
    # built with the pinned binaryen and checked here, and the release
    # publishes exactly it (docs/releasing.md → The release). The React, Vue
    # and Svelte components are its subpaths (#27), not packages of their own.
    # `@casoon/opengrid-mcp` (#140) is packed beside it, installed as npx would
    # and asked over stdio, and goes into the same artifact.
    steps:
      - uses: actions/checkout@v7
      # Toolchains, the pinned wasm tools and node: one composite action for
      # the four jobs that build the modules, where every version is pinned.
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - run: just package
      - name: npm publish --dry-run
        run: npm publish --dry-run
        working-directory: target/npm-package/package
      - run: just mcp-elements
      - run: just package-mcp
      - name: npm publish --dry-run (opengrid-mcp)
        run: npm publish --dry-run target/npm-package/casoon-opengrid-mcp-*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: target/npm-package/*.tgz
          if-no-files-found: error

  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Not with `browsers`: a run for the other engines is not a request for
    # new baselines.
    if: github.event_name == 'workflow_dispatch' && !inputs.browsers
    # Regenerates the **Linux** screenshot baselines and uploads them.
    #
    # They cannot be made on a developer's Mac: the same Chromium renders the
    # same page with different fonts, which is why the baselines are keyed by
    # platform at all (see tests/e2e/playwright.config.js). Run this by hand
    # after a visible control changes, download the artifact, and commit the
    # files — reading the diff first, because a baseline accepted without
    # looking is a test that has stopped testing.
    steps:
      - uses: actions/checkout@v7
      # Toolchains, the pinned wasm tools and node: one composite action for
      # the four jobs that build the modules, where every version is pinned.
      - uses: ./.github/actions/setup-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # What `just e2e` builds, from the one recipe both use: the modules, the
      # MCP view, the example server and the framework examples.
      - run: just e2e-prepare
      - name: Regenerate the Linux baselines
        run: pnpm exec playwright test --config tests/e2e/playwright.config.js --update-snapshots
      # Also after a failed test: a baseline that was written is worth reading
      # even when another spec fails.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-baselines
          path: tests/e2e/__screenshots__/*-linux.png
          if-no-files-found: error
