[package]
name = "opengrid-arrow-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arrow integration for opengrid: ingest and local query execution"

[lints]
workspace = true

[dependencies]
opengrid-types = { path = "../opengrid-types", features = ["arrow"] }
opengrid-query = { path = "../opengrid-query" }
opengrid-datasource = { path = "../opengrid-datasource" }
opengrid-planner = { path = "../opengrid-planner" }
arrow-array = "59"
arrow-schema = "59"
arrow-ord = "59"
arrow-row = "59"
arrow-select = "59"
serde_json = "1"

[dev-dependencies]
opengrid-conformance = { path = "../opengrid-conformance" }
proptest = "1"
criterion = "0.5"
xtask = { path = "../xtask" }

[[bench]]
name = "engine"
harness = false