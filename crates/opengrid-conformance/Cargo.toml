[package]
name = "opengrid-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Semantics conformance suite (S1-S14) for opengrid engines"
publish = false

[lints]
workspace = true

[dependencies]
opengrid-types = { path = "../opengrid-types" }
opengrid-query = { path = "../opengrid-query" }
# The docking point of the suite: every engine answers through this trait (point 09).
opengrid-datasource = { path = "../opengrid-datasource" }
# The binary result form, read by the HTTP runner (issue #48).
opengrid-columns = { path = "../opengrid-columns" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# check_source against a real source, and against a wrong one (issue #47).
opengrid-engine = { path = "../opengrid-engine" }
