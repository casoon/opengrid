[package]
name = "opengrid-connector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The contract a data source implements to be served by opengrid-server"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["connector", "data-source", "query", "opengrid"]
categories = ["database", "web-programming"]

[lints]
workspace = true

[dependencies]
opengrid-types = { workspace = true }
opengrid-query = { workspace = true }
opengrid-datasource = { workspace = true }
opengrid-pivot = { workspace = true }
# The rows tier (issue #46): a source that only hands out rows is answered by
# the engine, natively, on the server.
# With ICU4X's collations (rule S4a): what a source cannot sort, the engine
# sorts here, and a sort by a locale is part of that.
opengrid-engine = { workspace = true, features = ["icu"] }
# Tables of pieces, held together while streaming (issue #50).
opengrid-columns = { workspace = true }
# `LocalConnector::from_csv` reads the schema file.
opengrid-json = { workspace = true }

[dev-dependencies]
opengrid-conformance = { path = "../opengrid-conformance" }
