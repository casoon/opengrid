[package]
name = "opengrid-datasource-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PostgreSQL compiler and data source for opengrid"

[lints]
workspace = true

[dependencies]
opengrid-types = { path = "../opengrid-types" }
opengrid-query = { path = "../opengrid-query" }
opengrid-pivot = { path = "../opengrid-pivot" }
opengrid-datasource = { path = "../opengrid-datasource" }
# The contract the server takes its sources through (issue #45, E36).
opengrid-connector = { path = "../opengrid-connector" }

# Execution (decision E12). No decimal or date crate: every value travels as
# text with the cast the compiler wrote, which is also what keeps an exact
# decimal exact (point 26).
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
# Already in the build through both; the lease spawns its cancel request
# (issue #217).
tokio = { version = "1", features = ["rt"] }
opengrid-json = { path = "../opengrid-json" }
# TLS to the database (issue #220), behind the `tls` feature and off by default:
# `rustls` with the `ring` provider, which builds without system packages (no
# cmake, no OpenSSL headers). `connect_with_tls` itself takes any
# `MakeTlsConnect`, so an application may bring `native-tls` instead.
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[features]
# `rustls_connector`, the ready-made TLS connector for `connect_with_tls`.
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types"]

[dev-dependencies]
# The pivot tests compile and run pivots (point 31).
opengrid-pivot = { path = "../opengrid-pivot" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The conformance run needs the local engine as the other side of the
# comparison — that is the whole point of the differential test (R4).
opengrid-engine = { path = "../opengrid-engine" }
# Snapshot tests of the generated SQL (decision E12).
insta = "1"
opengrid-conformance = { path = "../opengrid-conformance" }
