[package]
name = "opengrid-datasource"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DataSource contract, capabilities and portable query result for opengrid"

[lints]
workspace = true

[dependencies]
opengrid-types = { path = "../opengrid-types" }
opengrid-query = { path = "../opengrid-query" }
# Generates the `Send` variant of `DataSource` from the one definition
# (plan/spezifikation/14-entscheidungen.md E5). Build-time only: a proc macro
# does not reach the wasm bundle.
trait-variant = "0.1"
# The wire form of results and errors (plan point 23). serde_json is already the
# workspace's JSON crate (query filters, the wasm binding); the wire module walks
# the document itself, because reading a value needs its column type first and
# JSON object keys have no order.
serde = { version = "1", features = ["derive"] }
serde_json = "1"