[package]
name = "opengrid-datasource"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The DataSource contract, capabilities and portable query result of opengrid"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["data-source", "query", "data-grid", "opengrid"]
categories = ["database", "data-structures"]

[lints]
workspace = true

[dependencies]
opengrid-types = { workspace = true }
opengrid-query = { workspace = true }
# Generates the `Send` variant of `DataSource` from the one definition
# (plan/spezifikation/14-entscheidungen.md E5). Build-time only: a proc macro
# does not reach the wasm bundle.
trait-variant = "0.1"
# The wire form of results and errors (plan point 23), through the one JSON
# codec of browser and server (issue #41). The wire module walks the document
# itself, because reading a value needs its column type first and JSON object
# keys have no order.
opengrid-json = { workspace = true }
# The binary form of an answer (E35) is read here, next to the JSON form.
opengrid-columns = { workspace = true }
