[package]
name = "opengrid-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The opengrid engine: ingest and local query execution over typed columns"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["query-engine", "columnar", "data-grid", "opengrid"]
categories = ["database-implementations", "data-structures", "wasm"]

[lints]
workspace = true

[dependencies]
opengrid-types = { workspace = true }
opengrid-columns = { workspace = true }
opengrid-query = { workspace = true }
opengrid-datasource = { workspace = true }
opengrid-planner = { workspace = true }
opengrid-json = { workspace = true }
# The collation of a locale for a sort (rule S4a, issue #391), behind the
# feature `icu`: ICU4X with its compiled data, about 300 KiB brotli in a wasm
# module. The engine module of the browser is built without it and gets its
# collator from a module of its own.
icu_collator = { version = "2.4", optional = true }
icu_locale_core = { version = "2", optional = true }

[features]
icu = ["dep:icu_collator", "dep:icu_locale_core"]

[dev-dependencies]
opengrid-conformance = { path = "../opengrid-conformance" }
proptest = "1"
criterion = "0.5"
xtask = { path = "../xtask" }

[[bench]]
name = "engine"
harness = false