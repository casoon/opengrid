[package]
name = "opengrid-export"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CSV, JSON and XLSX from an opengrid query result, piece by piece"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["export", "csv", "xlsx", "data-grid"]
categories = ["encoding", "database"]

[lints]
workspace = true

[dependencies]
opengrid-types = { workspace = true }
opengrid-datasource = { workspace = true }
# The pivot's answer (`PivotResult`), exported as it is shown (issue #3).
opengrid-pivot = { workspace = true }
opengrid-json = { workspace = true }
# XLSX (issue #72, decided by the owner): off by default, so the element and
# engine modules never carry it. The writer in the tab (#332) is a module of its
# own, loaded when a page asks for a workbook.
rust_xlsxwriter = { version = "0.102", default-features = false, optional = true }

[features]
# A workbook built in memory: what the tab can do, which has no temporary file.
xlsx = ["dep:rust_xlsxwriter"]
# `constant_memory` writes finished rows to a temporary file, so an export's
# memory does not grow with its rows: the server's, which has a file system.
xlsx-streaming = ["xlsx", "rust_xlsxwriter/constant_memory"]

[[test]]
name = "xlsx"
required-features = ["xlsx"]

[dev-dependencies]
# Opens a written workbook in the tests (issue #72): the archive
# `rust_xlsxwriter` already builds with, test-only.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The round trip: an export read back by the engine's own CSV ingest.
opengrid-engine = { path = "../opengrid-engine" }
opengrid-conformance = { path = "../opengrid-conformance" }
opengrid-query = { path = "../opengrid-query" }
xtask = { path = "../xtask" }
