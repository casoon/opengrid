[package]
name = "opengrid-json"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The one JSON codec of opengrid: a small reader and writer shared by the browser and the server"

[lints]
workspace = true

[dependencies]

[dev-dependencies]
# The oracle for the property tests: what the codec reads and writes is
# checked against serde_json, which it replaces (issue #41). Test-only.
# `float_roundtrip`: without it serde_json reads a float with a rounding error
# of one bit now and then (`69e31` as 6.899999999999999e32), and an oracle that
# is wrong makes the property tests fail on a correct parser (issue #257).
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"
