[package]
name = "opengrid-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Data gateway for opengrid, as a library: query AST in, columns out, sources handed in as connectors"

[lints]
workspace = true

[dependencies]
opengrid-types = { path = "../opengrid-types" }
opengrid-query = { path = "../opengrid-query" }
opengrid-pivot = { path = "../opengrid-pivot" }
opengrid-datasource = { path = "../opengrid-datasource" }
# The contract every source comes through (issue #45, E36).
opengrid-connector = { path = "../opengrid-connector" }
# The binary result form (E35), answered when `Accept` asks for it.
opengrid-columns = { path = "../opengrid-columns" }

# Server stack, decision E12.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = { version = "0.5", features = ["timeout"] }
# CORS. A gateway whose whole purpose is to answer a browser on another origin
# needs it; off by default, the application opts in per origin.
tower-http = { version = "0.6", features = ["cors"] }

# The export's response body (issue #2): a bounded channel the rows are
# written into, a piece at a time. Already in the tree through axum; decided on
# the issue over `futures-util` or a hand-written body.
http-body-util = { version = "0.1", features = ["channel"] }
# The export writes its rows in the one notation every export uses (E33).
opengrid-export = { path = "../opengrid-export", features = ["xlsx"] }

opengrid-json = { path = "../opengrid-json" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The whole suite through `POST /query` in both result forms (issue #38).
opengrid-conformance = { path = "../opengrid-conformance" }
# The tests hand the server the reference connectors: the local engine over
# the conformance fixture, and PostgreSQL (issue #49 — no database driver in
# the server itself).
opengrid-engine = { path = "../opengrid-engine" }
opengrid-datasource-postgres = { path = "../opengrid-datasource-postgres" }
# The tree through every reference connector (plan point 122).
opengrid-connector-sqlite = { path = "../opengrid-connector-sqlite" }
# The PostgreSQL export tests (issue #2) make their table and watch
# `pg_stat_activity` directly; test-only.
tokio-postgres = "0.7"
