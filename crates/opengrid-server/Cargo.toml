[package]
name = "opengrid-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Data gateway for opengrid: query AST in, column-oriented JSON out"

[lints]
workspace = true

[dependencies]
opengrid-types = { path = "../opengrid-types" }
opengrid-query = { path = "../opengrid-query" }
opengrid-pivot = { path = "../opengrid-pivot" }
opengrid-datasource = { path = "../opengrid-datasource" }
# The source of point 24 is the local engine: the server is fully testable
# before a database exists (PostgreSQL docks in point 26).
opengrid-arrow-engine = { path = "../opengrid-arrow-engine" }
# PostgreSQL as a source (point 26) — the registry decides per configuration.
opengrid-datasource-postgres = { path = "../opengrid-datasource-postgres" }

# Server stack, decision E12.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower = { version = "0.5", features = ["timeout"] }
# CORS. A gateway whose whole purpose is to answer a browser on another origin
# needs it; off by default, the configuration opts in per origin.
tower-http = { version = "0.6", features = ["cors"] }

# The export's response body (issue #2): a bounded channel the rows are
# written into, a piece at a time. Already in the tree through axum; decided on
# the issue over `futures-util` or a hand-written body.
http-body-util = { version = "0.1", features = ["channel"] }
# The export writes its rows in the one notation every export uses (E33).
opengrid-export = { path = "../opengrid-export" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The configuration format of plan/spezifikation/07-server.md is TOML.
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The PostgreSQL export tests (issue #2) make their table and watch
# `pg_stat_activity` directly. Already in the tree through
# opengrid-datasource-postgres; test-only.
tokio-postgres = "0.7"
