[package]
name = "opengrid-web-components"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Custom elements (<opengrid-table>, <opengrid-grid>) for opengrid"

[lints]
workspace = true

[lib]
# `cdylib` for the wasm-bindgen module `loader.js` loads, `rlib` for the browser
# test harness and for reuse by later components.
crate-type = ["cdylib", "rlib"]

# Which elements this module carries (plan point 40).
#
# `<opengrid-table>` is always in: it is the base element and costs almost
# nothing. `grid` and `pivot` are separable, and the default builds both — a
# consumer who wants one buys one. The numbers that justify the split are in
# plan/spezifikation/12-qualitaet.md §WASM-Größe.
[features]
default = ["grid", "pivot"]
grid = ["dep:opengrid-grid", "dep:opengrid-query"]
pivot = []

[dependencies]
opengrid-web-core = { path = "../opengrid-web-core" }
opengrid-datasource = { path = "../opengrid-datasource" }
opengrid-types = { path = "../opengrid-types" }
# Grid mode (point 16) drives the portable `GridState` of point 15.
opengrid-grid = { path = "../opengrid-grid", optional = true }
# Point 18 builds the filter `FilterExpr` of the query AST.
opengrid-query = { path = "../opengrid-query", optional = true }
# Query/result JSON of the table model; portable, so the model is host-testable.
serde_json = "1"

# Pinned to the CLI that builds the modules (E4/R7).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# CSV and JSON of a result for an export (point 83): one notation for the
# browser and the server.
opengrid-export = { path = "../opengrid-export" }
web-sys = { version = "0.3", features = [
    "CustomElementRegistry",
    # The event seam of point 35.
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DocumentFragment",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Node",
    "NodeList",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"