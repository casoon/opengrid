[package]
name = "opengrid-web-components"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Custom elements (<opengrid-table>, <opengrid-grid>) for opengrid"

[lints]
workspace = true

[lib]
# `cdylib` for the wasm-bindgen module `loader.js` loads, `rlib` for the browser
# test harness and for reuse by later components.
crate-type = ["cdylib", "rlib"]

# Which elements this module carries (plan point 40).
#
# `<opengrid-table>` is always in: it is the base element and costs almost
# nothing. `grid` and `pivot` are separable, and the default builds both — a
# consumer who wants one buys one. The numbers that justify the split are in
# plan/spezifikation/12-qualitaet.md §WASM-Größe.
[features]
default = ["grid", "pivot"]
grid = ["dep:opengrid-grid", "dep:opengrid-query"]
# The pivot reads the page's presentation (`set_columns`, `set_formats`), which
# is written in the grid's and the query's types: it pulls the same crates (#234).
pivot = ["dep:opengrid-grid", "dep:opengrid-query"]

[dependencies]
opengrid-web-core = { path = "../opengrid-web-core" }
opengrid-datasource = { path = "../opengrid-datasource" }
opengrid-types = { path = "../opengrid-types" }
# Grid mode (point 16) drives the portable `GridState` of point 15.
opengrid-grid = { path = "../opengrid-grid", optional = true }
# Point 18 builds the filter `FilterExpr` of the query AST.
opengrid-query = { path = "../opengrid-query", optional = true }
# Query/result JSON of the table model, views and texts — the one codec of
# browser and server (issue #41); portable, so the model is host-testable.
opengrid-json = { path = "../opengrid-json" }
# The binary result form a provider may answer in (E35, issue #38).
opengrid-columns = { path = "../opengrid-columns" }

# Pinned to the CLI that builds the modules (E4/R7).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# CSV and JSON of a result for an export (point 83): one notation for the
# browser and the server.
opengrid-export = { path = "../opengrid-export" }
# `get_pivot` reads the shown answer back into a `PivotResult` for the export
# (issue #3); already built as a dependency of `opengrid-export`.
opengrid-pivot = { path = "../opengrid-pivot" }
web-sys = { version = "0.3", features = [
    # The print table leaves with `afterprint`, once (issue #334).
    "AddEventListenerOptions",
    # The look of table and pivot, adopted into their shadow roots (issue #32).
    "ClipboardEvent",
    "CssStyleSheet",
    "CustomElementRegistry",
    # The event seam of point 35.
    "CustomEvent",
    "CustomEventInit",
    "DataTransfer",
    "Document",
    "DocumentFragment",
    "Element",
    "Event",
    "EventTarget",
    # The builder of the nested filter is a native modal dialog (issue #324).
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Node",
    "NodeList",
    # The filter row follows the columns' widths (issue #62).
    "ResizeObserver",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"