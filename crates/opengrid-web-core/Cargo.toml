[package]
name = "opengrid-web-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DOM layer, patch batching and custom-element lifecycle for opengrid"

[lints]
workspace = true

[dependencies]
# Portable view-model/patch logic stays native-testable; only the DOM glue below
# is browser-only (plan/spezifikation/11-crates.md §Portabilität).
opengrid-types = { path = "../opengrid-types" }

# Pinned to the CLI that builds the modules (E4/R7).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "CustomElementRegistry",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "ShadowRoot",
    "ShadowRootInit",
    "ShadowRootMode",
    "Window",
] }
