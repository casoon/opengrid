# `cargo deny check` (CI job `check`). The licence allowlist is what
# `cargo deny list` finds in Cargo.lock today, not a guess: a new dependency
# under another licence fails the check and needs a decision.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# LGPL-2.1-or-later appears only inside an OR expression; see the check output.

[advisories]
version = 2
# zip 8.6 comes in through rust_xlsxwriter (the writer) and the export crate's
# test-only reader. All four advisories concern `ZipArchive::extract` on an
# untrusted archive; neither writes nor test code extracts anything. The fix is
# zip >= 9, which needs rust_xlsxwriter to move first. Remove these when it does.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
