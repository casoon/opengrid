# `cargo deny check` (CI job `check`). The licence allowlist is what
# `cargo deny list` finds in Cargo.lock today, not a guess: a new dependency
# under another licence fails the check and needs a decision.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # The `tls` feature of opengrid-datasource-postgres (issue #220): rustls
    # with the `ring` provider (ring: Apache-2.0 AND ISC; rustls-webpki and
    # untrusted: ISC) and the Mozilla root certificates (webpki-roots: the
    # list is data, under CDLA-Permissive-2.0). All permissive.
    "ISC",
    "CDLA-Permissive-2.0",
]
# LGPL-2.1-or-later appears only inside an OR expression; see the check output.

[advisories]
version = 2
# An ignore that no longer matches anything (crate patched or gone) fails the check.
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
