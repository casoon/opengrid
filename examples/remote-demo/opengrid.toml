# Example configuration for the remote demo.
#
# The source here is the conformance data set through the local engine, so the
# server is fully demonstrable before a database is involved. For the 100k demo,
# point `path` at target/grid-demo/orders-100k.csv.

[server]
address = "127.0.0.1:8081"
# `just serve-demo` serves the page from :8080, which is a different origin.
# Without this list the server sends no CORS headers and the browser is not
# allowed to read the answer. No `*`: together with a bearer token that would
# hand the token to every page the user has open.
allowed_origins = ["http://127.0.0.1:8080", "http://localhost:8080"]

# Bearer tokens from the configuration. In a real deployment this reads
# `value = "${ORDERS_API_TOKEN}"` and the secret comes from the environment.
[[tokens]]
value = "demo-token-de"
context = { country = "DE" }

[[tokens]]
value = "demo-token-fr"
context = { country = "FR" }

[[datasources]]
name = "orders"
type = "local-csv"
path = "../../crates/opengrid-conformance/data/orders.csv"
schema = "../../crates/opengrid-conformance/data/orders.schema.json"
# These are the only columns a client may name at all.
allowed_fields = ["id", "customer", "country", "amount", "qty", "ordered_on", "ordered_year"]
# Appended to every query, taken from the token context, and not optional.
row_filter = { field = "country", op = "eq", value = ":country" }
