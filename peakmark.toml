# Budgets for the WebAssembly modules the package ships (issue #69).
# `just measure-modules` builds them into target/peakmark/ and runs `peakmark check`.
# A budget is the hard limit; peakmark.baseline.json holds the last accepted values.
# The margin over the measurement is about 1 %: `wasm-opt` does not build bit-for-bit.

[[module]]
name     = "elements"
artifact = "target/peakmark/both/m_bg.wasm"
glue     = "target/peakmark/both/m.js"

# Raised 2026-11-13 from 355500: the grid's `collation` attribute (#391: the
# attribute, its check, the collation written onto the text keys of every query
# the grid sends) grew the element module by 1.4 KiB, to 355811 B.
[module.budget]
brotli = "357600 B"

[[module]]
name     = "engine"
artifact = "target/peakmark/engine/m_bg.wasm"
glue     = "target/peakmark/engine/m.js"

# Raised 2026-11-13 from 160600: a sort key's locale (#391: the tag in the query
# model, the order by sort keys in both sort paths, the hook a collator is
# installed through and the call into the collation module) grew the engine by
# 4.2 KiB, to 163475 B. The collation's tables are not in it: they are the
# module `collation` below.
# Raised 2026-11-14 from 165100: the JSON fast path (#426: one pass over the text
# into the column builders, the general reader kept as the fallback) grew the
# engine by 1.6 KiB, to 165070 B; the load of a JSON array is 1.7 to 3 times faster.
# Raised 2026-11-14 from 166800: reading a CSV file in pieces (#427: the loader that keeps a
# record that is cut between two pieces, the three calls and the abort on the engine) grew the
# engine by 2.4 KiB, to 168318 B.
# Raised 2026-11-14 from 170000: a page of a big table is taken without sorting the table (#428:
# the bounded selection beside the full sort, once for each key type) grew the engine by 3.6 KiB,
# to 171901 B; the sort of a million rows takes half the time and 42 MiB less of the module.
# Raised 2026-11-16 from 173700: rows that arrive as packs of typed columns (#445: the loader that
# appends a pack to the column builders, with the derived columns, and the four calls on the
# engine) grew it by 3.7 KiB, to 175703 B; a million row objects reach the first rows in 0.27 s
# instead of 1.2 s and the page holds 461 MiB less.
# 2026-11-16: integers stored as wide as they need (#447: the buffer and its widening, read through
# `get` by the sort, the filter and the aggregates) grew it by 1.1 KiB, to 176878 B; the columns of
# a million rows of ten columns are 29 MiB smaller. Inside the budget, which stays.
# Raised 2026-11-17 from 177500: text with few distinct texts as a dictionary (#451: the dictionary,
# its builder and lookup, the filters that test each distinct text once) grew it by 2.1 KiB, to
# 178980 B; the columns of a million rows of ten columns are another 21 MiB smaller and a text
# search takes half the time.
[module.budget]
brotli         = "180500 B"
peak_memory    = "26 MiB"
growth_per_run = "0"

[[scenario]]
module = "engine"
file   = "scripts/peakmark/engine.mjs"
repeat = 5

[[module]]
name     = "xlsx"
artifact = "target/peakmark/xlsx/m_bg.wasm"
glue     = "target/peakmark/xlsx/m.js"

[module.budget]
brotli         = "249000 B"
peak_memory    = "64 MiB"
growth_per_run = "0"

[[scenario]]
module = "xlsx"
file   = "scripts/peakmark/xlsx.mjs"
repeat = 5

# The collator of the browser (#391): ICU4X with its data, a module of its own
# that the providers load when a query first sorts by a locale.
[[module]]
name     = "collation"
artifact = "target/peakmark/collation/m_bg.wasm"
glue     = "target/peakmark/collation/m.js"

# 333152 B, 2026-11-13: almost all of it data (1.08 MB raw of 1.19 MB) — the
# root collation, NFD normalisation and every CLDR locale's tailoring.
[module.budget]
brotli = "336500 B"
