<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid aggregate fixture</title>
    <style>
      /* Point 63: five rows chosen for what they break. North's amounts sum to
         9007199254740994.02 — past 2^53, where a sum that slipped through an
         f64 would lose its last digits (S8). South has a NULL amount, which a
         sum and an average must skip and a count must not count (S11); the
         last row has no region, so there is a NULL group too. */
      opengrid-grid {
        display: block;
        height: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid aggregate fixture</h1>
      <opengrid-grid
        label="Umsätze"
        datasource="sales"
        columns="id,region,amount,qty,day"
        group-by="region"
        window-size="12"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();
        await init();
        const engine = new Engine();
        const schema = await (await fetch("/tests/e2e/fixtures/grid-aggregate.schema.json")).text();
        const csv = await (await fetch("/tests/e2e/fixtures/grid-aggregate.csv")).arrayBuffer();
        engine.load_csv("sales", new Uint8Array(csv), schema);

        window.__queries = [];
        const host = document.querySelector("opengrid-grid");
        // Configured before the provider, the ordinary order: the check runs
        // again when the typed schema arrives (point 60).
        loader.module.set_columns(host, {
          amount: { aggregate: "sum" },
          qty: { aggregate: "avg" },
          day: { aggregate: "max" },
        });
        loader.module.set_provider(host, {
          execute: (queryJson) => {
            window.__queries.push(queryJson);
            return engine.execute(queryJson);
          },
        });
        window.__opengridModule = loader.module;
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
