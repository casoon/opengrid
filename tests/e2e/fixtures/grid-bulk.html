<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid bulk fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid bulk fixture</h1>
      <opengrid-grid
        label="Courses"
        datasource="courses"
        columns="id,name,room,seats"
        window-size="12"
        row-key="id"
        selection
        column-menu
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #187: one value for every selected row. `name` is the page's own
      // column (read-only); the events are only recorded.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__bulk = [];
      document.addEventListener("opengrid-bulk-change", (event) => window.__bulk.push(event.detail));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: true },
          { name: "room", type: "utf8", nullable: true },
          { name: "seats", type: "int64", nullable: true },
        ],
      });
      const rows = Array.from({ length: 40 }, (_, index) => ({
        id: index + 1,
        name: `Course ${index + 1}`,
        room: "A1",
        seats: index,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("courses", rows, schema);
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      loader.module.set_columns(host, { name: { readonly: true } });
      loader.module.set_choices(host, { room: ["A1", "B2", "C3"] });
      window.__module = loader.module;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
