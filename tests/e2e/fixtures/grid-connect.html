<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid connect fixture</title>
    <style>
      /* Point 76: a grid supplied through `connect` instead of the module
         functions one by one. */
      opengrid-grid {
        display: block;
        height: 260px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid connect fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,country,amount,qty"
        window-size="20"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { connect, loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        // `?fallback`: the element module cannot be loaded, the way a page
        // without WebAssembly sees it. The first `loadOpengrid` call decides.
        if (location.search.includes("fallback")) {
          await loadOpengrid({ moduleUrl: "/nowhere/opengrid_web_components.js" });
        }

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (await fetch("/tests/e2e/fixtures/grid-virtual.csv")).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        // Every query the grid asks for, so a test can count them.
        window.__queries = [];
        window.__provider = () => ({
          execute: (queryJson) => {
            window.__queries.push(queryJson);
            return engine.execute(queryJson);
          },
        });
        window.__connect = connect;
        return true;
      }

      window.__ready = start();
    </script>
  </body>
</html>
