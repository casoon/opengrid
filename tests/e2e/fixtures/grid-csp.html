<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Issue #139: a strict page — WebAssembly may compile, JavaScript may
         not be built at run time ('unsafe-eval' is absent). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'"
    />
    <title>opengrid strict CSP fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 224px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid strict CSP fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,amount,ordered_on"
        window-size="10"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__violations = [];
      document.addEventListener("securitypolicyviolation", (event) =>
        window.__violations.push(event.violatedDirective + " " + event.blockedURI),
      );

      await init();
      const engine = new Engine();
      const schema = await (await fetch("/crates/opengrid-conformance/data/orders.schema.json")).text();
      const csv = await (await fetch("/tests/e2e/fixtures/grid-virtual.csv")).arrayBuffer();
      engine.load_csv("orders", new Uint8Array(csv), schema);

      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      loader.module.set_formats(host, {
        amount: { kind: "number", locale: "de-DE", style: "currency", currency: "EUR" },
        ordered_on: { kind: "date", locale: "de-DE", dateStyle: "long" },
      });
      loader.module.set_provider(host, createLocalProvider(engine));
      window.__ready = true;
    </script>
  </body>
</html>
