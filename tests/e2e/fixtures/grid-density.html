<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid density fixture</title>
    <style>
      /* The same 200 rows as the virtual fixture, but deliberately **without**
         a pinned `--og-row-height`: this fixture is where the densities of
         point 58 are measured, and a page rule on the host would beat the
         `:host([density=…])` rule in the shadow stylesheet and hide the bug. */
      opengrid-grid {
        display: block;
        height: 224px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid density fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,country,amount"
        window-size="8"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Point 17: the same provider seam as the other grids, over a larger
      // dataset so the virtual window really moves.
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-virtual.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-grid");
        loader.module.set_provider(host, {
          execute: (queryJson) => engine.execute(queryJson),
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
