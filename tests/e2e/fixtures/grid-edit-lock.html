<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid edit lock fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 360px;
        width: 900px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid edit lock fixture</h1>
      <opengrid-grid
        label="Rooms"
        datasource="rooms"
        columns="id,name,seats,city"
        window-size="12"
        row-key="id"
        toolbar
        column-menu
        edit-toggle
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #527: the reader's locks. Switches by query string: `?locked` sets
      // `edit-locked` at first; `?marked` marks `name` and `seats` as `editable`;
      // `?opened` also opens `city`'s editor with `readonly: false` on top of
      // that; `?readonlyseats` makes `seats` `readonly`. Every cell change and
      // every view change is recorded, in order.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      const search = new URLSearchParams(location.search);
      const grid = document.querySelector("opengrid-grid");
      if (search.has("locked")) grid.setAttribute("edit-locked", "");
      window.__events = [];
      window.__views = [];
      window.__queries = 0;
      document.addEventListener("opengrid-cell-change", (event) => window.__events.push(event.detail));
      document.addEventListener("opengrid-view-change", (event) => window.__views.push(event.detail.view));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "seats", type: "int64", nullable: true },
          { name: "city", type: "utf8", nullable: true },
        ],
      });
      const rows = Array.from({ length: 6 }, (_, index) => ({
        id: index + 1,
        name: `R${index + 1}`,
        seats: 10 * (index + 1),
        city: ["Berlin", "Hamburg", "Munich"][index % 3],
      }));
      const engine = createLocalProvider(new Engine());
      await engine.loadRows("rooms", rows, schema);
      const provider = {
        kind: "local",
        async execute(queryJson, mode) {
          window.__queries += 1;
          return engine.execute(queryJson, mode);
        },
      };
      const loader = await loadOpengrid();
      const columns = {};
      if (search.has("marked")) {
        columns.name = { editable: true };
        columns.seats = { editable: true };
      }
      if (search.has("opened")) columns.city = { readonly: false };
      if (search.has("readonlyseats")) columns.seats = { ...columns.seats, readonly: true };
      if (Object.keys(columns).length) loader.module.set_columns(grid, columns);
      window.__module = loader.module;
      loader.module.set_provider(grid, provider);
      window.__ready = true;
    </script>
  </body>
</html>
