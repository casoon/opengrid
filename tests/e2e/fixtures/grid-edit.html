<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid editing fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 260px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid editing fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,amount,qty"
        window-size="10"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Point 37: the component edits and validates; **the page saves**. Every
      // change is recorded here so the spec can prove the event carries what a
      // page needs to persist it.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      document.addEventListener("opengrid-cell-change", (event) =>
        window.__changes.push(event.detail),
      );

      await init();
      const engine = new Engine();
      const schema = await (await fetch("/tests/e2e/fixtures/grid-orders.schema.json")).text();
      const csv = await (await fetch("/tests/e2e/fixtures/grid-orders.csv")).arrayBuffer();
      engine.load_csv("orders", new Uint8Array(csv), schema);

      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      // A column whose editor should be a <select>: V1 has no enum type, so the
      // page is the only honest source of the options.
      host.__opengridChoices = { customer: ["Alpha", "Beta", "Gamma"] };
      loader.module.set_provider(host, createLocalProvider(engine));
      window.__ready = true;
    </script>
  </body>
</html>
