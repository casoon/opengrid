<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid editable fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid editable fixture</h1>
      <opengrid-grid
        label="Rooms"
        datasource="rooms"
        columns="id,name,seats,opened"
        window-size="12"
        row-key="id"
        add-row
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #523: what can be edited, and what the reader sees of it. The key
      // column is read-only; `name` and `seats` are the columns the page means
      // to be edited; `opened` is neither.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__events = [];
      for (const type of ["opengrid-cell-change", "opengrid-row-add", "opengrid-paste"]) {
        document.addEventListener(type, (event) => window.__events.push({ type, ...event.detail }));
      }

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "seats", type: "int64", nullable: true },
          { name: "opened", type: "date", nullable: true },
        ],
      });
      const rows = Array.from({ length: 4 }, (_, index) => ({
        id: index + 1,
        name: `R${index + 1}`,
        seats: 10 * (index + 1),
        opened: `202${index}-03-01`,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("rooms", rows, schema);
      const loader = await loadOpengrid();
      const grid = document.querySelector("opengrid-grid");
      window.__module = loader.module;
      // `pinNarrow: "none"`: a pinned key column (#525) takes its row's background.
      loader.module.set_columns(grid, {
        id: { pinNarrow: "none" },
        name: { editable: true },
        seats: { editable: true },
      });
      loader.module.set_provider(grid, provider);
      window.__ready = true;
    </script>
  </body>
</html>
