<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid enter-moves fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 280px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid enter-moves fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,qty"
        window-size="12"
        row-key="id"
        enter-moves="down"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #536: `Enter` that commits moves to the next data row. Query switches:
      //   ?rows=N     how many records (default 6)
      //   ?group      group by customer
      //   ?locked     edit-locked
      //   ?plain      no enter-moves attribute: the default
      //   ?choices    the customer column edits in a combobox
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      const query = new URLSearchParams(location.search);
      window.__changes = [];
      document.addEventListener("opengrid-cell-change", (event) => window.__changes.push(event.detail));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "customer", type: "utf8", nullable: true },
          { name: "qty", type: "int64", nullable: false },
        ],
      });
      const customers = ["Alpha", "Beta", "Gamma"];
      const count = Number(query.get("rows") ?? 6);
      const rows = Array.from({ length: count }, (_, index) => ({
        id: index + 1,
        // Alpha, Beta and Gamma by turns: three records each in a grid of six or nine.
        customer: customers[(index + 1) % 3],
        qty: index + 1,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("orders", rows, schema);

      // Before the element is defined, so these are its attributes from the start.
      const host = document.querySelector("opengrid-grid");
      if (query.has("group")) host.setAttribute("group-by", "customer");
      if (query.has("locked")) host.setAttribute("edit-locked", "");
      if (query.has("plain")) host.removeAttribute("enter-moves");
      const loader = await loadOpengrid();
      // A value the page does not take: the commit is held back, the editor stays.
      loader.module.set_validators(host, {
        qty: { validate: (value) => (value === "99" ? { level: "error", message: "99 is too many." } : null), block: true },
      });
      if (query.has("choices")) loader.module.set_choices(host, { customer: customers });
      window.__module = loader.module;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
