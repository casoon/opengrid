<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid grouped editing fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 260px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid grouped editing fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,amount,qty"
        group-by="customer"
        window-size="12"
        row-key="id"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #190: editing while grouped. `?nokey` takes the row-key away, and
      // editing stays off, as it was.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      document.addEventListener("opengrid-cell-change", (event) =>
        window.__changes.push(event.detail),
      );

      await init();
      const engine = new Engine();
      const schema = await (await fetch("/tests/e2e/fixtures/grid-orders.schema.json")).text();
      const csv = await (await fetch("/tests/e2e/fixtures/grid-orders.csv")).arrayBuffer();
      engine.load_csv("orders", new Uint8Array(csv), schema);

      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      if (location.search.includes("nokey")) {
        host.removeAttribute("row-key");
      }
      window.__module = loader.module;
      window.__engine = engine;
      window.__provider = createLocalProvider(engine);
      loader.module.set_provider(host, window.__provider);
      window.__ready = true;
    </script>
  </body>
</html>
