<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid grouped selection fixture</title>
    <style>
      /* Issue #322: selecting rows while grouped, over the 200 conformance
         rows. `?nokey` takes the row-key away, and selection stays off;
         `?menu` adds the column menu. */
      opengrid-grid {
        display: block;
        height: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid grouped selection fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,country,flag,amount"
        group-by="country,customer"
        window-size="12"
        row-key="id"
        selection
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      // Every selection the page hears of.
      window.__selections = [];
      document.addEventListener("opengrid-selection-change", (event) =>
        window.__selections.push(event.detail),
      );

      const loader = await loadOpengrid();
      await init();
      const engine = new Engine();
      const schema = await (await fetch("/crates/opengrid-conformance/data/orders.schema.json")).text();
      const csv = await (await fetch("/tests/e2e/fixtures/grid-virtual.csv")).arrayBuffer();
      engine.load_csv("orders", new Uint8Array(csv), schema);

      const host = document.querySelector("opengrid-grid");
      if (location.search.includes("nokey")) {
        host.removeAttribute("row-key");
      }
      // The column menu: the one way a reader sorts a grouped grid.
      if (location.search.includes("menu")) {
        host.setAttribute("column-menu", "");
      }
      window.__queries = [];
      loader.module.set_provider(host, {
        execute: (queryJson) => {
          window.__queries.push(queryJson);
          // A test can make the source refuse the check of a view's keys.
          if (window.__failChecks && JSON.parse(queryJson).filter?.op === "in") {
            return Promise.reject(new Error("check refused"));
          }
          return engine.execute(queryJson);
        },
      });
      window.__module = loader.module;
      window.__ready = true;
    </script>
  </body>
</html>
