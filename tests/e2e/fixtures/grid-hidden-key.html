<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid hidden key fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid hidden key fixture</h1>
      <opengrid-grid
        label="Rooms"
        datasource="rooms"
        columns="name,seats"
        window-size="12"
        row-key="id"
        selection
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #529: `row-key` names a field outside `columns`. The key is never
      // drawn, yet it names every record: in events, selection, saving, undo and
      // the detail panel. `?group` groups by `seats`, `?paged` shows pages of 5,
      // `?unknown` names a key that is no field of the source.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      window.__selections = [];
      window.__details = [];
      document.addEventListener("opengrid-cell-change", (event) => window.__changes.push(event.detail));
      document.addEventListener("opengrid-selection-change", (event) =>
        window.__selections.push(event.detail),
      );

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "seats", type: "int64", nullable: false },
        ],
      });
      // The ids run backwards, so a row's place never equals its key.
      const rows = Array.from({ length: 40 }, (_, index) => ({
        id: 1000 - index,
        name: `Room ${String(index + 1).padStart(2, "0")}`,
        seats: (index % 4) + 1,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("rooms", rows, schema);
      // Set before the element is defined, as markup would.
      const host = document.querySelector("opengrid-grid");
      if (location.search.includes("group")) host.setAttribute("group-by", "seats");
      if (location.search.includes("paged")) host.setAttribute("page-size", "5");
      if (location.search.includes("unknown")) host.setAttribute("row-key", "nope");
      const loader = await loadOpengrid();
      loader.module.set_detail_renderer(host, (record, key) => {
        window.__details.push({ key, record });
        const box = document.createElement("div");
        box.dataset.key = String(key);
        box.textContent = `${record.name} (${key})`;
        return box;
      });
      loader.module.set_provider(host, provider);
      window.__module = loader.module;
      window.__ready = true;
    </script>
  </body>
</html>
