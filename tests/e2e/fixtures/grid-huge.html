<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid huge result fixture</title>
    <style>
      /* The engine holds 200 rows and the result claims a total of its own, so
         rows past 200 come back empty. A window (window-size) of 20 covers the
         viewport and its overscan. The filter row is a fixed 40px and the
         status line a 24px minimum, so the host is 64px taller than the 160px
         viewport. */
      opengrid-grid {
        display: block;
        height: 224px;
        /* Pinned, not inherited: the assertions in the matching spec are
           arithmetic on a 32px row (sizer heights, scroll offsets, cell
           heights). They are about the window math, not about what a grid
           looks like by default — since point 58 that default is the `normal`
           density, and a math test must not move when a design decision does.
           The densities themselves are covered by grid-density.spec.js. */
        --og-row-height: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid huge result fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,country,amount"
        window-size="20"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Point 17: the same provider seam as the other grids, over a larger
      // dataset so the virtual window really moves.
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-virtual.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-grid");
        // The engine holds 200 rows; the result claims `window.__total`. The rows
        // of a window past the 200 come back empty, which is all a test about
        // the scroll mechanics of a very long result needs.
        window.__total ??= 3_000_000;
        // How many times the grid asked: a drag of the scroll bar must not ask
        // more often than it scrolls.
        window.__queries = 0;
        loader.module.set_provider(host, {
          execute: (queryJson) => {
            window.__queries += 1;
            const result = JSON.parse(engine.execute(queryJson));
            return JSON.stringify({ ...result, total_count: window.__total });
          },
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
