<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid keyboard walk fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid keyboard walk fixture</h1>
      <button id="before" type="button">before</button>
      <!-- Everything a keyboard reaches in one grid: header, filter row,
           toolbar, cells, editor, pager. -->
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,amount,qty"
        page-size="2"
        toolbar
      ></opengrid-grid>
      <button id="after" type="button">after</button>
    </main>
    <script type="module">
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      document.addEventListener("opengrid-cell-change", (event) => window.__changes.push(event.detail));

      await init();
      const engine = new Engine();
      const schema = await (await fetch("/tests/e2e/fixtures/grid-orders.schema.json")).text();
      const csv = await (await fetch("/tests/e2e/fixtures/grid-orders.csv")).arrayBuffer();
      engine.load_csv("orders", new Uint8Array(csv), schema);

      const loader = await loadOpengrid();
      loader.module.set_provider(document.querySelector("opengrid-grid"), createLocalProvider(engine));
      window.__ready = true;
    </script>
  </body>
</html>
