<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid lists fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid lists fixture</h1>
      <opengrid-grid
        label="Teachers"
        datasource="teachers"
        columns="id,name,subjects,rooms"
        window-size="12"
        row-key="id"
        toolbar
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #185: list columns. `subjects` is a list<utf8> over choices with labels,
      // `rooms` a list<int64>. Every change is recorded.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      document.addEventListener("opengrid-cell-change", (event) => window.__changes.push(event.detail));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "subjects", type: "list<utf8>", nullable: true },
          { name: "rooms", type: "list<int64>", nullable: true },
        ],
      });
      const rows = [
        { id: 1, name: "Ada", subjects: ["m", "p"], rooms: [101, 102] },
        { id: 2, name: "Grace", subjects: ["m"], rooms: [] },
        { id: 3, name: "Edsger", subjects: [], rooms: [101] },
        { id: 4, name: "Barbara", subjects: null, rooms: null },
        { id: 5, name: "Linus", subjects: ["p", "c", "m"], rooms: [103] },
      ];
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("teachers", rows, schema);
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      loader.module.set_choices(host, {
        subjects: [
          { value: "m", label: "Maths" },
          { value: "p", label: "Physics" },
          { value: "c", label: "Chemistry" },
          { value: "b", label: "Biology" },
        ],
        rooms: [101, 102, 103, 104],
        name: ["Ada", "Grace", "Edsger", "Barbara", "Linus"],
      });
      window.__module = loader.module;
      window.__host = host;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
