<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid live fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid live fixture</h1>
      <opengrid-grid
        label="Customers"
        datasource="customers"
        columns="id,name"
        window-size="12"
        row-key="id"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #328: a source that changes under the grid. The grid gets a
      // provider that forwards to a local one *without* `watch`, so loading rows
      // again changes the data silently — the page says nothing until it
      // dispatches `opengrid-source-changed`, as a REST provider's stream does.
      import { loadOpengrid, createLocalProvider, createRestProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
        ],
      });
      const rowsOf = (from) => Array.from({ length: 20 }, (_, index) => ({ id: from + index, name: `Customer ${from + index}` }));
      const local = createLocalProvider(new Engine());
      await local.loadRows("customers", rowsOf(1), schema);
      const silent = { kind: "local", execute: (...args) => local.execute(...args) };

      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      window.__changed = [];
      host.addEventListener("opengrid-source-changed", (event) => {
        window.__changed.push({ name: event.detail.name, cancelable: event.cancelable });
        if (window.__prevent) event.preventDefault();
      });
      window.__module = loader.module;
      window.__reload = (from) => local.loadRows("customers", rowsOf(from), schema);
      window.__rest = (url) => createRestProvider({ url, source: "customers", watch: true });
      loader.module.set_provider(host, silent);
      window.__ready = true;
    </script>
  </body>
</html>
