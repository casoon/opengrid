<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid paging fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 260px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid paging fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,amount"
        page-size="5"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      await init();
      const engine = new Engine();
      const schema = await (await fetch("/tests/e2e/fixtures/grid-long.schema.json")).text();
      const csv = await (await fetch("/tests/e2e/fixtures/grid-long.csv")).arrayBuffer();
      engine.load_csv("orders", new Uint8Array(csv), schema);

      const loader = await loadOpengrid();
      loader.module.set_provider(
        document.querySelector("opengrid-grid"),
        createLocalProvider(engine),
      );
      window.__ready = true;
    </script>
  </body>
</html>
