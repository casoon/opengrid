<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>opengrid paste fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid paste fixture</h1>
      <opengrid-grid
        label="Items"
        datasource="items"
        columns="id,name,price,seats,note"
        window-size="12"
        row-key="id"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #184: pasting a block. The page is German (`lang="de"`), so a
      // decimal is written `1.234,50`. `?add` sets `add-row`.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__pasted = [];
      document.addEventListener("opengrid-paste", (event) => window.__pasted.push(event.detail));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "price", type: { decimal: { precision: 12, scale: 2 } }, nullable: true },
          { name: "seats", type: "int64", nullable: true },
          { name: "note", type: "utf8", nullable: true },
        ],
      });
      const rows = Array.from({ length: 40 }, (_, index) => ({
        id: index + 1,
        name: `Item ${index + 1}`,
        price: "1.00",
        seats: index,
        note: null,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("items", rows, schema);
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      if (location.search.includes("add")) {
        host.setAttribute("add-row", "");
      }
      window.__module = loader.module;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
