<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid phase F fixture</title>
    <style>
      /* Point 70: every surface Phase F added, switched on at once — toolbar,
         chips, search, facets, column menu, selection, grouping, aggregates.
         The page speaks English and the grid's own words are German, so every
         leaf node has to tell whose word it carries: ours inherit `de`, the
         page's (column names, values) inherit nothing from inside the grid. */
      opengrid-grid {
        display: block;
        height: 560px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid phase F fixture</h1>
      <opengrid-grid
        label="Orders"
        datasource="orders"
        columns="id,customer,country,amount,qty,ordered_on"
        toolbar
        search
        facets
        column-menu
        selection
        window-size="12"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-virtual.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-grid");
        // Only a few keys: the rest stay English defaults, which is the case a
        // partial translation produces and must still carry `de` where set.
        loader.module.set_texts(host, {
          lang: "de",
          matchesOther: "{count} Treffer",
          chipsClear: "Alle entfernen",
          facetsReset: "Zurücksetzen",
          facetFrom: "Von",
          facetTo: "Bis",
          sortAscending: "Aufsteigend sortieren",
          searchSuggestions: "Spalten",
          typeText: "Text",
          emptyReset: "Filter zurücksetzen",
        });
        loader.module.set_columns(host, {
          customer: { facet: "list" },
          country: { facet: "pills" },
          amount: { facet: "range", aggregate: "sum" },
          qty: { aggregate: "sum" },
          ordered_on: { facet: "period" },
        });
        loader.module.set_provider(host, { execute: (queryJson) => engine.execute(queryJson) });
        window.__opengridModule = loader.module;
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
