<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid record form fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid record form fixture</h1>
      <opengrid-grid
        label="Courses"
        datasource="courses"
        columns="id,name,room,seats,note,open"
        window-size="12"
        row-key="id"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #325: a record as a form. `name` is the page's own column
      // (read-only), `room` has choices, `seats` is required, a `note` may not
      // say "no" (a blocking validator). The events are only recorded.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__cells = [];
      window.__opens = [];
      window.__prevent = false;
      document.addEventListener("opengrid-cell-change", (event) => window.__cells.push(event.detail));
      document.addEventListener("opengrid-record-open", (event) => {
        window.__opens.push(event.detail);
        if (window.__prevent) event.preventDefault();
      });

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: true },
          { name: "room", type: "utf8", nullable: true },
          { name: "seats", type: "int64", nullable: false },
          { name: "note", type: "utf8", nullable: true },
          { name: "open", type: "bool", nullable: false },
        ],
      });
      const rows = Array.from({ length: 40 }, (_, index) => ({
        id: index + 1,
        name: `Course ${index + 1}`,
        room: "A1",
        seats: index,
        note: "fine",
        open: false,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("courses", rows, schema);
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      loader.module.set_columns(host, { name: { readonly: true } });
      loader.module.set_choices(host, { room: ["A1", "B2", "C3"] });
      loader.module.set_validators(host, {
        note: {
          validate: (value) => (value.trim().toLowerCase() === "no" ? { level: "error", message: "Say more than no." } : null),
          block: true,
        },
      });
      window.__module = loader.module;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
