<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid grid row-height fixture</title>
    <style>
      /* The row height is configurable through --og-row-height. A document
         rule on the host overrides the shadow default (32px) and inherits into
         the shadow tree; the window math follows the configured height. The
         host is 64px taller than the 160px viewport: the 40px filter row plus
         the 24px status line. */
      opengrid-grid {
        display: block;
        height: 224px;
        --og-row-height: 48px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid grid row-height fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,country,amount"
        window-size="8"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Point 17 review: the same provider seam as the virtual grid, over 200
      // rows, with a non-default `--og-row-height`.
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-virtual.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-grid");
        loader.module.set_provider(host, {
          execute: (queryJson) => engine.execute(queryJson),
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
