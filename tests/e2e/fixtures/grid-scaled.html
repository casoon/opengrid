<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid scaled integer fixture</title>
    <script>
      // Issue #537: `?lang=de` writes numbers `1.234,50`, the default is English
      // (`1,234.50`). `?group` groups by region, to see the sums.
      const lang = new URLSearchParams(location.search).get("lang");
      if (lang) document.documentElement.lang = lang;
    </script>
    <style>
      opengrid-grid {
        display: block;
        height: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid scaled integer fixture</h1>
      <opengrid-grid
        label="Prices"
        datasource="prices"
        columns="id,region,price_cent,qty,rating"
        window-size="12"
        row-key="id"
        selection
        toolbar
        filter-builder
        search
        facets
        column-menu
      ></opengrid-grid>
    </main>
    <script type="module">
      // `price_cent` is money as cents (int64, `scale: 2`): 612 is read and typed
      // as 6,12. `qty` is a plain integer beside it and `rating` a float, which a
      // scale must be refused on.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      window.__bulk = [];
      window.__pasted = [];
      window.__queries = [];
      window.__seen = [];
      // What a copy writes: through a `copy` event's data, or — where the browser
      // sends none — `navigator.clipboard.writeText`.
      window.__copied = [];
      const setData = DataTransfer.prototype.setData;
      DataTransfer.prototype.setData = function (type, value) {
        if (type === "text/plain") window.__copied.push(value);
        return setData.call(this, type, value);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText = async (text) => void window.__copied.push(text);
      }
      document.addEventListener("opengrid-cell-change", (event) => window.__changes.push(event.detail));
      document.addEventListener("opengrid-bulk-change", (event) => window.__bulk.push(event.detail));
      document.addEventListener("opengrid-paste", (event) => window.__pasted.push(event.detail));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "region", type: "utf8", nullable: true },
          { name: "price_cent", type: "int64", nullable: true },
          { name: "qty", type: "int64", nullable: true },
          { name: "rating", type: "float64", nullable: true },
        ],
      });
      const cents = [612, 500, 499, 123450, 5, 250, null, 1000];
      const rows = cents.map((price_cent, index) => ({
        id: index + 1,
        region: [0, 1, 5, 6].includes(index) ? "A" : "B",
        price_cent,
        qty: index + 1,
        rating: 0.5,
      }));
      const engine = createLocalProvider(new Engine());
      await engine.loadRows("prices", rows, schema);
      const provider = {
        kind: "local",
        execute: (queryJson) => {
          window.__queries.push(JSON.parse(queryJson));
          return engine.execute(queryJson);
        },
      };
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      if (location.search.includes("group")) host.setAttribute("group-by", "region");
      window.__columns = {
        id: { pinNarrow: "none" },
        price_cent: { title: "Price", scale: 2, aggregate: "sum", facet: "range" },
      };
      loader.module.set_columns(host, window.__columns);
      // The format is applied to the scaled number: 6,12 on a German page.
      loader.module.set_formats(host, {
        price_cent: { kind: "number", minimumFractionDigits: 2, maximumFractionDigits: 2 },
      });
      // A validator is given what the page will be told: the stored integer.
      loader.module.set_validators(host, {
        price_cent: (value) => {
          window.__seen.push(value);
          return null;
        },
      });
      window.__module = loader.module;
      window.__host = host;
      window.__provider = provider;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
