<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid cell template fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid cell template fixture</h1>
      <opengrid-grid
        label="Customers"
        datasource="customers"
        columns="id,name,status,note"
        window-size="12"
        row-key="id"
        search
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #317: a link and a badge instead of a cell's text. `name` is a
      // link, `status` a badge, `note` answers a string. `__built` counts how
      // often a node was made.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__built = 0;
      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "status", type: "utf8", nullable: false },
          { name: "note", type: "utf8", nullable: true },
        ],
      });
      const rows = Array.from({ length: 40 }, (_, index) => ({
        id: index + 1,
        name: `Customer ${index + 1}`,
        status: index % 3 === 0 ? "open" : "closed",
        note: `note ${index + 1}`,
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("customers", rows, schema);
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      window.__templates = {
        name: ({ text, key, row }) => {
          window.__built += 1;
          const link = document.createElement("a");
          link.href = `#customer-${key}`;
          link.textContent = text;
          link.dataset.id = String(row.id);
          return link;
        },
        status: ({ value, text }) => {
          window.__built += 1;
          const badge = document.createElement("span");
          badge.className = `badge badge-${value}`;
          badge.textContent = text;
          return badge;
        },
        note: ({ text }) => `${text}!`,
      };
      loader.module.set_cell_templates(host, window.__templates);
      window.__module = loader.module;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
