<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid tree fixture</title>
    <style>
      /* Issue #135: the conformance org chart as a tree — two roots, an
         orphan whose parent 99 does not exist, four levels under Sales. The
         queries are counted so a test can check "a level is one query". */
      opengrid-grid {
        display: block;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid tree fixture</h1>
      <opengrid-grid
        label="Organisation"
        datasource="tree"
        columns="name,region,revenue"
        tree="parent_id"
        window-size="12"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/tree.schema.json")
        ).text();
        const csv = await (
          await fetch("/crates/opengrid-conformance/data/tree.csv")
        ).arrayBuffer();
        engine.load_csv("tree", new Uint8Array(csv), schema);

        window.__queries = [];
        const host = document.querySelector("opengrid-grid");
        // Exposed for the export spec (issue #166), which asks it directly.
        window.__provider = {
          execute: (queryJson) => {
            window.__queries.push(queryJson);
            return engine.execute(queryJson);
          },
        };
        loader.module.set_provider(host, window.__provider);
        window.__opengridModule = loader.module;
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
