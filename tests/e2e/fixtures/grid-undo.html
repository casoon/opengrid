<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid undo fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid undo fixture</h1>
      <opengrid-grid
        label="Rooms"
        datasource="rooms"
        columns="id,name,seats"
        window-size="12"
        row-key="id"
        add-row
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #186: undo and redo. Every event the grid fires is recorded, in order.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__events = [];
      for (const type of ["opengrid-cell-change", "opengrid-row-add", "opengrid-paste"]) {
        document.addEventListener(type, (event) => window.__events.push({ type, ...event.detail }));
      }

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "seats", type: "int64", nullable: true },
        ],
      });
      const rows = Array.from({ length: 6 }, (_, index) => ({
        id: index + 1,
        name: `R${index + 1}`,
        seats: 10 * (index + 1),
      }));
      const provider = createLocalProvider(new Engine());
      await provider.loadRows("rooms", rows, schema);
      const loader = await loadOpengrid();
      window.__module = loader.module;
      window.__provider = provider;
      window.__schema = schema;
      window.__rows = rows;
      loader.module.set_provider(document.querySelector("opengrid-grid"), provider);
      window.__ready = true;
    </script>
  </body>
</html>
