<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>opengrid validation fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 320px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid validation fixture</h1>
      <opengrid-grid
        label="Rooms"
        datasource="rooms"
        columns="id,name,seats"
        window-size="12"
        row-key="id"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Issue #188: validators that talk while the reader types. `seats` over 60
      // warns and never blocks; `name` is a duplicate when it is one that exists,
      // and that column blocks.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      window.__changes = [];
      window.__calls = [];
      document.addEventListener("opengrid-cell-change", (event) => window.__changes.push(event.detail));

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "name", type: "utf8", nullable: false },
          { name: "seats", type: "int64", nullable: true },
        ],
      });
      const names = ["A1", "B2", "C3", "D4"];
      const provider = createLocalProvider(new Engine());
      await provider.loadRows(
        "rooms",
        names.map((name, index) => ({ id: index + 1, name, seats: 10 * (index + 1) })),
        schema,
      );
      const loader = await loadOpengrid();
      const host = document.querySelector("opengrid-grid");
      loader.module.set_validators(host, {
        seats: (value, row) => {
          window.__calls.push({ value, row });
          return Number(value) > 60 ? { level: "warning", message: "More than 60 seats is a hall." } : null;
        },
        name: {
          validate: (value) => (names.includes(value) ? { level: "error", message: `${value} exists already.` } : null),
          block: true,
        },
      });
      window.__module = loader.module;
      loader.module.set_provider(host, provider);
      window.__ready = true;
    </script>
  </body>
</html>
