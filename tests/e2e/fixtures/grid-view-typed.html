<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid typed view fixture</title>
    <style>
      /* Point 66: the four kinds of facet over the 200 conformance rows —
         customer as a list, country as pills, amount as a range, ordered_on as
         a period. Queries are counted: every facet counts with one `group`
         query per column, not one per value. */
      opengrid-grid {
        display: block;
        height: 520px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid typed view fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,amount,qty,ratio,ordered_on,created_at"
        toolbar
        facets
        window-size="20"
      ></opengrid-grid>
    </main>
    <script type="module">
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-virtual.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        // Point 88: every query the element asks for, so a test can read the
        // literal a view's filter became.
        window.__queries = [];
        window.__engine = engine;

        const host = document.querySelector("opengrid-grid");
        loader.module.set_columns(host, {
          customer: { facet: "list" },
          amount: { facet: "range" },
          ordered_on: { facet: "period" },
        });
        loader.module.set_provider(host, {
          execute: (queryJson) => {
            window.__queries.push(queryJson);
            return engine.execute(queryJson);
          },
        });
        // For the view-before-the-first-result test: a provider over the same
        // engine, and the module.
        window.__provider = () => ({
          execute: (queryJson) => {
            window.__queries.push(queryJson);
            return engine.execute(queryJson);
          },
        });
        // The module itself, so the tests can call `get_query`/`set_view`.
        window.__opengridModule = loader.module;
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
