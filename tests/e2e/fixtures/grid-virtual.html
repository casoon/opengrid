<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid virtual grid fixture</title>
    <style>
      /* A small window (window-size) over 200 rows: the DOM row count must stay
         at the pool size while scrolling. The filter row is a fixed 40px and
         the status line a 24px minimum, so the host is 64px taller than the
         160px viewport. */
      opengrid-grid {
        display: block;
        height: 224px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid virtual grid fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,country,amount"
        window-size="8"
      ></opengrid-grid>
    </main>
    <script type="module">
      // Point 17: the same provider seam as the other grids, over a larger
      // dataset so the virtual window really moves.
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/crates/opengrid-conformance/data/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-virtual.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-grid");
        loader.module.set_provider(host, {
          execute: (queryJson) => engine.execute(queryJson),
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
