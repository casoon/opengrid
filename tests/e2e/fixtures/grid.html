<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid grid fixture</title>
    <style>
      /* A definite height makes the scroll viewport and the PageUp/PageDown
         viewport step deterministic (5 rows of the 32px pool window). The
         filter row is a fixed 40px, so the host is 40px taller than the 160px
         viewport to keep that step unchanged. */
      opengrid-grid {
        display: block;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid grid fixture</h1>
      <!-- Focusable neighbours make the Tab/Shift+Tab assertions deterministic:
           the roving tabindex means the browser leaves the grid on its own. -->
      <button id="before" type="button">before</button>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,amount,qty"
        window-size="10"
      ></opengrid-grid>
      <button id="after" type="button">after</button>
    </main>
    <script type="module">
      // Point 16: same provider seam as the table. loader.js loads/registers the
      // components WASM module; the engine module is the one built by
      // `just wasm-build`.
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/tests/e2e/fixtures/grid-orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-orders.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-grid");
        loader.module.set_provider(host, {
          execute: (queryJson) => engine.execute(queryJson),
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
