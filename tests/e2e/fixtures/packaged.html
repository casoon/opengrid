<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid packaged fixture</title>
    <style>
      opengrid-grid {
        display: block;
        height: 224px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>opengrid packaged fixture</h1>
      <opengrid-grid
        label="Bestellungen"
        datasource="orders"
        columns="id,customer,amount,qty"
        window-size="10"
      ></opengrid-grid>
      <opengrid-table label="Bestellungen" datasource="orders"></opengrid-table>
      <opengrid-pivot label="Bestellungen" datasource="orders"></opengrid-pivot>
    </main>
    <script type="module">
      // Plan point 40: everything the elements need comes from the **packed**
      // package under target/npm-package/package, produced by
      // `bash xtask/pack-npm.sh`. Nothing here reaches into packages/opengrid
      // or into crates/ — if `package.json#files` forgets a file, this page
      // fails to load and tests/e2e/packaged.spec.js says so.
      //
      // The engine comes from the package too: it ships under `engine/`, and
      // this page queries in the tab with it, on the main thread.
      import {
        loadOpengrid,
        createLocalProvider,
      } from "/target/npm-package/package/loader.js";
      import init, { Engine } from "/target/npm-package/package/engine/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();
        if (loader.fallback) {
          throw new Error("the packaged module did not load — DOM fallback ran");
        }

        await init();
        const engine = new Engine();
        const provider = createLocalProvider(engine);
        const schema = await (
          await fetch("/tests/e2e/fixtures/grid-orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/grid-orders.csv")
        ).arrayBuffer();
        await provider.load("orders", csv, schema);

        for (const host of document.querySelectorAll(
          "opengrid-grid, opengrid-table",
        )) {
          loader.module.set_provider(host, provider);
        }

        // The package's own manifest, read through the package rather than from
        // the repository, so the test asserts what a consumer would install.
        window.__manifest = await (
          await fetch("/target/npm-package/package/package.json")
        ).json();
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
