<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid pivot on the local engine</title>
  </head>
  <body>
    <main>
      <h1>opengrid pivot on the local engine</h1>
      <opengrid-pivot
        label="Rooms by zone"
        datasource="rooms"
        rows="zone"
        values='[{"fn":"count","as":"n"}]'
      ></opengrid-pivot>
    </main>
    <script type="module">
      // Issue #233: a pivot over the engine on the main thread, no server.
      import { loadOpengrid, createLocalProvider } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      await init();
      const schema = JSON.stringify({
        fields: [
          { name: "id", type: "int64", nullable: false },
          { name: "zone", type: "utf8", nullable: false },
        ],
      });
      const provider = createLocalProvider(new Engine());
      await provider.loadRows(
        "rooms",
        [
          { id: 1, zone: "north" },
          { id: 2, zone: "south" },
          { id: 3, zone: "north" },
        ],
        schema,
      );
      const loader = await loadOpengrid();
      loader.module.set_provider(document.querySelector("opengrid-pivot"), provider);
      window.__ready = true;
    </script>
  </body>
</html>
