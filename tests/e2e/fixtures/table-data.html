<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid table data fixture</title>
  </head>
  <body>
    <main>
      <h1>opengrid table data fixture</h1>
      <opengrid-table
        label="Bestellungen"
        datasource="orders"
        columns="customer,amount,qty"
      ></opengrid-table>
    </main>
    <script type="module">
      // Point 14: the page owns the engine and hands it to the element as a
      // provider. loader.js loads/registers the components WASM module; the
      // engine module is the one built by `just wasm-build`.
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();

        await init();
        const engine = new Engine();
        const schema = await (
          await fetch("/tests/e2e/fixtures/orders.schema.json")
        ).text();
        const csv = await (
          await fetch("/tests/e2e/fixtures/orders.csv")
        ).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);

        const host = document.querySelector("opengrid-table");
        loader.module.set_provider(host, {
          execute: (queryJson) => engine.execute(queryJson),
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
