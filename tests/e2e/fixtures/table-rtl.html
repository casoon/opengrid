<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opengrid right-to-left table fixture</title>
  </head>
  <body>
    <main>
      <h1>opengrid right-to-left table fixture</h1>
      <!-- Issue #320: the table takes the direction from `dir` on the document. -->
      <opengrid-table
        label="Orders"
        datasource="orders"
        columns="customer,amount,qty"
      ></opengrid-table>
    </main>
    <script type="module">
      import { loadOpengrid } from "/packages/opengrid/loader.js";
      import init, { Engine } from "/examples/engine-demo/pkg/opengrid_wasm.js";

      async function start() {
        const loader = await loadOpengrid();
        await init();
        const engine = new Engine();
        const schema = await (await fetch("/tests/e2e/fixtures/orders.schema.json")).text();
        const csv = await (await fetch("/tests/e2e/fixtures/orders.csv")).arrayBuffer();
        engine.load_csv("orders", new Uint8Array(csv), schema);
        loader.module.set_provider(document.querySelector("opengrid-table"), {
          execute: (queryJson) => engine.execute(queryJson),
        });
        return { fallback: loader.fallback };
      }

      window.__opengridReady = start();
    </script>
  </body>
</html>
